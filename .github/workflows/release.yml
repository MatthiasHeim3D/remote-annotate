name: Release

# Run from the Actions tab: tags a commit on main with its Nerdbank.GitVersioning
# version, then builds the relay image and the client release for that tag.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit SHA to release (leave empty for the tip of main)
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore Nerdbank.GitVersioning
        run: dotnet tool restore

      - name: Create and push the version tag
        id: tag
        shell: bash
        env:
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          commit="$(git rev-parse --verify "${INPUT_COMMIT:-origin/main}^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "Commit '$commit' is not on the main branch." >&2
            exit 1
          fi

          tag="$(dotnet nbgv tag "$commit" --what-if)"
          if [[ -z "$tag" || "$tag" != v* ]]; then
            echo "Nerdbank.GitVersioning returned an unexpected tag: '$tag'." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "The tag '$tag' already exists. Nothing was released." >&2
            exit 1
          fi

          dotnet nbgv tag "$commit"
          git push origin "refs/tags/$tag"
          echo "Tagged $commit as $tag" >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  relay:
    needs: tag
    uses: ./.github/workflows/publish-relay-image.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: read
      packages: write

  client:
    needs: tag
    uses: ./.github/workflows/publish-client-release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
